name: Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

# 같은 PR에서 리뷰가 겹치면 이전 실행을 취소한다
concurrency:
  group: code-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # PR 이벤트이거나, PR에 달린 `/` 로 시작하는 코멘트일 때만 실행한다
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    # 자체 호스팅 모델이라 응답이 느리다. 재시도를 다 밟아도 이 안에서 끝나야 한다
    timeout-minutes: 30
    # 스텝의 if: 에서는 secrets 컨텍스트를 읽을 수 없다. 조건을 걸려면 env로 한 번 옮겨야 한다.
    env:
      HAS_APP: ${{ secrets.REVIEW_APP_ID }}
    steps:
      # 리뷰 코멘트를 github-actions[bot]이 아니라 우리 GitHub App 이름으로 남기기 위해
      # 설치 토큰을 발급받는다. 이 App은 웹훅을 받지 않고 신원으로만 쓴다 —
      # 트리거는 위 `on:` 의 리포지토리 이벤트가 담당한다.
      # App 시크릿을 등록하지 않았으면 이 스텝을 건너뛰고 github.token으로 동작한다.
      - name: App 설치 토큰 발급
        id: app-token
        if: env.HAS_APP != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 코드베이스 맥락(파일 트리, import 그래프, 호출부)을 읽기 위해 체크아웃이 필요하다
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token || github.token }}

      # 이 리포지토리는 자기 자신을 리뷰한다 — 체크아웃된 PR 버전의 봇이 그대로 돌아간다.
      # 다른 리포지토리에서는 `uses: it-play/Code-Review-Bot@main` 을 쓴다.
      - name: Review
        uses: ./
        with:
          gsml-api-key: ${{ secrets.GSML_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}
