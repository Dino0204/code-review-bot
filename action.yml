name: 'GLM Code Review Bot'
description: 'z.ai GLM-4.7-Flash로 Pull Request를 리뷰하고 GitHub 코멘트로 남긴다'
author: 'it-play'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  zai-api-key:
    description: 'z.ai API 키 (https://z.ai/manage-apikey/apikey-list)'
    required: true
  github-token:
    description: 'PR 코멘트 작성용 토큰'
    required: false
    default: ${{ github.token }}
  model:
    description: '사용할 GLM 모델 ID'
    required: false
    default: 'glm-4.7-flash'
  fallback-models:
    description: '기본 모델이 용량 부족으로 막힐 때 순서대로 시도할 대체 모델 (쉼표 구분). 빈 문자열이면 폴백 없음'
    required: false
    default: 'glm-4.5-flash'
  base-url:
    description: 'z.ai API base URL'
    required: false
    default: 'https://api.z.ai/api/paas/v4'
  language:
    description: '리뷰 코멘트 언어 (ko, en, ja, zh)'
    required: false
    default: 'ko'
  trigger-prefix:
    description: '코멘트 트리거 접두사'
    required: false
    default: '/review'
  min-severity:
    description: '코멘트할 최소 심각도 (critical | major | minor | nit)'
    required: false
    default: 'minor'
  auto-review:
    description: 'PR이 열리거나 갱신될 때 자동 리뷰 여부'
    required: false
    default: 'true'
  max-files:
    description: '한 번에 리뷰할 최대 파일 수'
    required: false
    default: '40'
  instructions:
    description: '리포지토리별 추가 리뷰 지침 (자유 텍스트)'
    required: false
    default: ''

outputs:
  findings:
    description: '보고된 지적 사항 수'
  verdict:
    description: 'approve | comment | request_changes'
  prompt_tokens:
    description: '소비한 입력 토큰 수'
  completion_tokens:
    description: '소비한 출력 토큰 수'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
