name: 'GSML Code Review Bot'
description: 'GSML 게이트웨이의 모델로 Pull Request를 리뷰하고 GitHub 코멘트로 남긴다'
author: 'it-play'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  gsml-api-key:
    description: 'GSML API 키 (https://gsmsv.site 에서 발급)'
    required: true
  github-token:
    description: 'PR 코멘트 작성용 토큰'
    required: false
    default: ${{ github.token }}
  model:
    description: '사용할 모델 ID (GSML은 /v1/models 에 뜨는 모델 하나만 서빙한다)'
    required: false
    default: 'darwin-35b-q4_k_m.gguf'
  fallback-models:
    description: '기본 모델이 용량 부족으로 막힐 때 순서대로 시도할 대체 모델 (쉼표 구분). GSML은 단일 모델이라 기본값이 없다'
    required: false
    default: ''
  base-url:
    description: 'OpenAI 호환 API base URL'
    required: false
    default: 'http://ssh.gsmsv.site:26145/v1'
  language:
    description: '리뷰 코멘트 언어 (ko, en, ja, zh)'
    required: false
    default: 'ko'
  trigger-prefix:
    description: '코멘트 트리거 접두사'
    required: false
    default: '/review'
  min-severity:
    description: '코멘트할 최소 심각도 (critical | major | minor | nit)'
    required: false
    default: 'minor'
  auto-review:
    description: 'PR이 열리거나 갱신될 때 자동 리뷰 여부'
    required: false
    default: 'true'
  max-files:
    description: '한 번에 리뷰할 최대 파일 수'
    required: false
    default: '40'
  instructions:
    description: '리포지토리별 추가 리뷰 지침 (자유 텍스트)'
    required: false
    default: ''

outputs:
  findings:
    description: '보고된 지적 사항 수'
  verdict:
    description: 'approve | comment | request_changes'
  prompt_tokens:
    description: '소비한 입력 토큰 수'
  completion_tokens:
    description: '소비한 출력 토큰 수'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
