# 모델 provider 체인. 위에서부터 순서대로 시도한다.
#
# 이 파일은 서버 운영자 소관이다 — 리포지토리의 `.reviewbot/config.yml` 에서는 provider 를
# 고르지 못한다. 리포 주인이 운영자 키로 임의 모델을 부르는 것을 막기 위해서다.
#
# `${VAR}` 는 환경변수로 치환된다. 값이 비면 그 provider 만 체인에서 빠지고 로그가 남는다 —
# 키 하나가 없다고 봇이 안 뜨면 안 된다. 전부 비면 부팅이 실패한다.
#
# `contextWindow` / `maxOutputTokens` 는 pi-ai 레지스트리가 아는 모델이면 비워도 된다.
# 설치된 pi-ai 판이 모르는 모델(아래 google·glm·openrouter 가 그렇다)만 적는다.

providers:
  # 무료 한도가 가장 넉넉하고 컨텍스트가 크다 — 1순위가 배치 크기를 정한다.
  # gemini-3.6-flash 는 설치된 pi-ai 판의 레지스트리에는 아직 없어 두 크기를 직접 적는다.
  - name: google
    api: google-generative-ai
    model: gemini-3.6-flash
    apiKey: ${GOOGLE_API_KEY}
    maxPromptChars: 400000
    timeoutMs: 120000
    contextWindow: 1048576
    maxOutputTokens: 65536

  # z.ai 오픈 플랫폼. 코딩 플랜 엔드포인트(/api/coding/paas/v4)와는 다른 주소다
  - name: glm
    api: openai-completions
    baseUrl: https://api.z.ai/api/paas/v4
    model: glm-4.7
    apiKey: ${GLM_API_KEY}
    maxPromptChars: 200000
    timeoutMs: 120000
    contextWindow: 204800
    maxOutputTokens: 32768

  - name: openrouter
    api: openai-completions
    baseUrl: https://openrouter.ai/api/v1
    model: z-ai/glm-5.2:free
    apiKey: ${OPENROUTER_API_KEY}
    maxPromptChars: 100000
    timeoutMs: 120000
    contextWindow: 256000
    maxOutputTokens: 230400

  - name: mistral
    api: mistral-conversations
    model: mistral-medium-latest
    apiKey: ${MISTRAL_API_KEY}
    maxPromptChars: 100000
    timeoutMs: 120000

# 분류별로 provider 를 얼마나 쉬게 할지. 생략하면 아래 값이 기본이다.
cooldown:
  rateLimitMs: 300000 # 429 → 5분
  quotaMs: 3600000 # 일일 한도 소진 → 1시간
  serverErrorMs: 60000 # 5xx·타임아웃 → 1분
