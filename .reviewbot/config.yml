# 코드 리뷰 봇 설정 — 리뷰 대상 리포지토리의 루트에 둔다.
# 모든 항목은 선택이며, 지정하지 않으면 기본값을 쓴다.

# --- 모델 ---
model: glm-4.7-flash # 무료 티어. 더 깊은 리뷰가 필요하면 glm-4.7-flashx 또는 glm-4.7 (잔액 필요)
# glm-4.7-flash는 무료 공용 용량이라 혼잡하면 통째로 막힌다(429 / 코드 1305).
# 그때 순서대로 시도할 대체 모델. 빈 배열이면 폴백 없이 실패한다.
fallbackModels:
  - glm-4.5-flash
language: ko
temperature: 0.2
thinking: true # chain-of-thought 활성화 (품질↑, 지연시간↑)
maxOutputTokens: 24576 # reasoning 토큰도 여기에 포함된다. 부족하면 응답이 잘린다

# --- 리뷰 범위 ---
maxFiles: 40 # 변경량이 큰 파일부터 이 개수까지만 리뷰
maxFileChars: 24000 # 파일 하나를 컨텍스트에 실을 때의 상한
maxPromptChars: 320000 # 한 번의 호출에 실어보낼 프롬프트 상한 (200K 컨텍스트 기준)
maxRelatedFiles: 12 # import 그래프/호출부에서 끌어올 관련 파일 수

exclude:
  - '**/*.generated.ts'
  - 'docs/**'
# include를 지정하면 여기 매칭되는 파일만 리뷰한다 (기본: 전체)
# include:
#   - 'src/**'

# --- 코멘트 정책 ---
autoReview: true # PR이 열리거나 갱신되면 자동 리뷰
minSeverity: minor # critical | major | minor | nit
minConfidence: 0.5 # 이 확신도 미만의 지적은 버린다
maxInlineComments: 25
triggerPrefix: '/review'

# --- 코드베이스 맥락 ---
contextFile: .reviewbot/context.md # 사람이 관리하는 아키텍처/규약 문서
memoryFile: .reviewbot/memory.md # `/learn` 이 갱신하는 봇 메모리
memoryAutoCommit: false # true면 `/learn` 이 기본 브랜치에 직접 커밋 (contents: write 권한 필요)

# --- 리포지토리별 추가 지침 ---
customInstructions: |
  - 이 리포지토리는 TypeScript strict 모드다. any 사용을 지적하라.
  - 외부 API 호출에는 반드시 타임아웃과 재시도가 있어야 한다.
  - 사용자 입력을 그대로 로그에 남기는 코드는 보안 이슈로 취급하라.
